<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Manager — BakeSync</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="alternate icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-content" id="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger" id="hamburger" type="button" aria-label="Open sidebar"></button>
                    <nav class="breadcrumb" id="topbar-breadcrumb" aria-label="breadcrumb"></nav>
                </div>
                <div class="topbar-right">
                    <span class="topbar-username" id="topbar-username"></span>
                    <span class="topbar-role-badge" id="topbar-role-badge"></span>
                    <button type="button" onclick="logout()" class="btn btn-ghost btn-sm">Sign Out</button>
                </div>
            </header>

            <main class="page-content" id="page-content">
                <div class="content-card" style="margin-bottom: 1.25rem;">
                    <h3 style="margin-bottom: 0.5rem;">Document Manager</h3>
                    <p style="color: var(--muted-foreground); font-size: 0.875rem;">
                        Your files and shared documents. DAC rules are enforced when viewing private files.
                    </p>

                    <div style="display:flex; gap: 0.75rem; align-items:center; justify-content: space-between; flex-wrap: wrap; margin-top: 1rem;">
                        <div class="filter-tabs" id="files-filter-tabs"></div>
                        <input
                            id="files-search"
                            type="text"
                            placeholder="Search files..."
                            style="min-width: 240px;"
                        />
                    </div>
                </div>

                <div class="content-card files-upload-card" style="margin-bottom: 1.25rem;">
                    <button type="button" class="btn btn-primary" id="files-upload-toggle">+ Add New Document</button>
                    <div id="files-upload-panel" class="upload-panel collapsed">
                        <div class="upload-panel-body">
                            <input type="file" id="files-file-input" class="sr-only" accept=".pdf,.doc,.docx,.txt,.rtf,.odt,.xlsx,.xls,.csv,.ods,.ppt,.pptx,.odp,.jpg,.jpeg,.png,.webp,.gif,.zip" aria-label="Choose file" />

                            <div class="file-drop-zone" id="file-drop-zone" role="button" tabindex="0">
                                <strong>Drag and drop</strong> or click to browse<br />
                                <span style="font-size: 0.8125rem;">.pdf .xlsx .docx .txt .csv .pptx .jpg .png .zip — max 250 MB</span>
                            </div>

                            <div id="files-selected-preview" class="files-selected-preview">
                                <span id="files-selected-name"></span>
                                <button type="button" class="btn btn-ghost btn-sm" id="files-clear-file" aria-label="Remove file">× Remove</button>
                            </div>

                            <div class="upload-row">
                                <input type="text" id="files-upload-filename" placeholder="Filename (auto-filled from file)" />
                                <select id="files-upload-type">
                                    <option value="recipe">Recipe</option>
                                    <option value="report">Report</option>
                                    <option value="schedule">Schedule</option>
                                    <option value="invoice">Invoice</option>
                                </select>
                            </div>

                            <div class="upload-row" style="margin-top: 0.75rem;">
                                <textarea id="files-upload-description" rows="2" placeholder="Description (optional)"></textarea>
                            </div>

                            <div class="upload-row" style="margin-top: 0.75rem;">
                                <div class="upload-visibility">
                                    <label class="checkbox-wrapper">
                                        <input type="radio" name="files-is-public" value="0" checked />
                                        <span>Private</span>
                                    </label>
                                    <label class="checkbox-wrapper">
                                        <input type="radio" name="files-is-public" value="1" />
                                        <span>Public</span>
                                    </label>
                                </div>
                            </div>

                            <div id="upload-progress-wrap" style="display: none;">
                                <div class="upload-progress-track">
                                    <div id="upload-progress-fill" class="upload-progress-fill"></div>
                                </div>
                                <div id="upload-progress-text" style="font-size: 0.8125rem; color: var(--muted-foreground);"></div>
                            </div>

                            <div class="upload-row upload-actions-row">
                                <button type="button" class="btn btn-primary" id="files-upload-submit">Upload File</button>
                                <button type="button" class="btn btn-outline" id="files-upload-cancel">Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="files-cards"></div>
            </main>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        initSidebar();
        setActiveNavItem();
        initMobileSidebar();
        initNavbar();
        if (typeof renderBreadcrumb === 'function') renderBreadcrumb();
        initFilesPage();
    </script>
</body>
</html>
