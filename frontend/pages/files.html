<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Manager — BakeSync</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="alternate icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-content" id="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger" id="hamburger" type="button" aria-label="Open sidebar"></button>
                    <nav class="breadcrumb" id="topbar-breadcrumb" aria-label="breadcrumb"></nav>
                </div>
                <div class="topbar-right">
                    <span class="topbar-username" id="topbar-username"></span>
                    <span class="topbar-role-badge" id="topbar-role-badge"></span>
                    <button type="button" onclick="logout()" class="btn btn-ghost btn-sm">Sign Out</button>
                </div>
            </header>

            <main class="page-content" id="page-content">
                <div class="content-card" style="margin-bottom: 1.25rem;">
                    <h3 style="margin-bottom: 0.5rem;">Document Manager</h3>
                    <p style="color: var(--muted-foreground); font-size: 0.875rem;">
                        Your files and shared documents. DAC rules are enforced when viewing private files.
                    </p>

                    <div style="display:flex; gap: 0.75rem; align-items:center; justify-content: space-between; flex-wrap: wrap; margin-top: 1rem;">
                        <div class="filter-tabs" id="files-filter-tabs"></div>
                        <input
                            id="files-search"
                            type="text"
                            placeholder="Search files..."
                            style="min-width: 240px;"
                        />
                    </div>
                </div>

                <div id="files-dac-summary" class="files-dac-summary" aria-live="polite"></div>

                <div class="content-card files-upload-card">
                    <button type="button" class="btn btn-primary btn-full" id="files-upload-toggle">+ Add New Document</button>
                    <div id="files-upload-panel" class="upload-panel files-upload-panel-inner collapsed">
                        <div class="upload-dropzone" id="files-upload-dropzone">
                            <div class="upload-dropzone-icon" aria-hidden="true"></div>
                            <p class="upload-dropzone-title">
                                Drop your file here or
                                <label for="files-file-input" class="upload-browse-link">browse</label>
                            </p>
                            <p class="upload-dropzone-hint">
                                PDF, DOCX, XLSX, TXT, CSV, PPTX, JPG, PNG — max 250 MB
                            </p>
                            <input
                                type="file"
                                id="files-file-input"
                                class="upload-file-input"
                                accept=".pdf,.doc,.docx,.txt,.rtf,.xls,.xlsx,.csv,.ppt,.pptx,.jpg,.jpeg,.png,.webp,.gif,.zip"
                            />
                        </div>

                        <div class="upload-file-preview" id="files-upload-file-preview" style="display:none;">
                            <div class="upload-file-info">
                                <span class="upload-file-icon" id="files-upload-file-icon"></span>
                                <div class="upload-file-details">
                                    <span class="upload-file-name" id="files-upload-file-name"></span>
                                    <span class="upload-file-size" id="files-upload-file-size"></span>
                                </div>
                                <button class="upload-file-remove" id="files-upload-file-remove" type="button" title="Remove file">×</button>
                            </div>
                        </div>

                        <div class="upload-progress-wrap" id="files-upload-progress-wrap" style="display:none;">
                            <div class="upload-progress-bar">
                                <div class="upload-progress-fill" id="files-upload-progress-fill" style="width: 0%;"></div>
                            </div>
                            <span class="upload-progress-text" id="files-upload-progress-text">0%</span>
                        </div>

                        <div class="upload-fields">
                            <div class="upload-field-group">
                                <label for="files-upload-filename">Filename</label>
                                <input type="text" id="files-upload-filename" placeholder="e.g., croissant_recipe_v2.pdf" maxlength="100" />
                            </div>
                            <div class="upload-field-group">
                                <label for="files-upload-type">Document Type</label>
                                <select id="files-upload-type">
                                    <option value="">Select type...</option>
                                    <option value="recipe">Recipe</option>
                                    <option value="report">Report</option>
                                    <option value="schedule">Schedule</option>
                                    <option value="invoice">Invoice</option>
                                </select>
                            </div>
                        </div>

                        <div class="upload-field-group">
                            <label for="files-upload-description">Description (optional)</label>
                            <textarea id="files-upload-description" rows="2" placeholder="Brief description of this document..." maxlength="500"></textarea>
                        </div>

                        <div class="upload-visibility-row">
                            <span class="upload-visibility-label">Visibility</span>
                            <label class="upload-radio-label">
                                <input type="radio" name="files-upload-visibility" value="0" checked />
                                <span>Private</span>
                            </label>
                            <label class="upload-radio-label">
                                <input type="radio" name="files-upload-visibility" value="1" />
                                <span>Public</span>
                            </label>
                            <span class="upload-visibility-hint">Private files are only visible to you.</span>
                        </div>

                        <div class="upload-actions">
                            <button class="btn btn-primary" id="files-upload-submit" type="button" disabled>Upload File</button>
                            <button class="btn btn-ghost" id="files-upload-cancel" type="button">Cancel</button>
                        </div>

                        <div class="upload-error" id="files-upload-error" style="display:none;"></div>
                    </div>
                </div>

                <div id="files-cards"></div>
            </main>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        initSidebar();
        setActiveNavItem();
        initMobileSidebar();
        initNavbar();
        if (typeof renderBreadcrumb === 'function') renderBreadcrumb();
        initFilesPage();
    </script>
</body>
</html>
