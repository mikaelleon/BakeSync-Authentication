<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supply Chain — BakeSync</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="alternate icon" href="../favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content" id="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburger" type="button" aria-label="Open sidebar"></button>
          <nav class="breadcrumb" id="topbar-breadcrumb" aria-label="breadcrumb"></nav>
        </div>
        <div class="topbar-right">
          <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark mode" title="Dark mode">
            <svg class="theme-toggle-icon theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            <svg class="theme-toggle-icon theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </button>
        </div>
      </header>
      <main class="page-content" id="page-content">
        <div class="coming-soon-container">
          <div class="coming-soon-icon" id="coming-soon-icon"></div>
          <h1 class="coming-soon-title">Supply Chain</h1>
          <p class="coming-soon-body">
            This module is part of the full BakeSync ERP system.
            It is available as a navigation target to demonstrate
            the complete sidebar structure and role-based access.
          </p>
          <div class="coming-soon-badge">Coming Soon</div>
          <a href="javascript:history.back()" class="btn btn-ghost">← Go Back</a>
        </div>
      </main>
    </div>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
    (function () {
      requireAuth();
      initSidebar();
      setActiveNavItem();
      initMobileSidebar();
      initNavbar();
      if (typeof renderBreadcrumb === 'function') renderBreadcrumb();
      var el = document.getElementById('coming-soon-icon');
      if (el && typeof icon === 'function') el.innerHTML = icon('truck').replace('width="16" height="16"', 'width="28" height="28"');
    })();
  </script>
</body>
</html>
