<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Point of Sale - BakeSync</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
        <path d="m4.6 13.11 5.79-3.21c1.89-1.05 4.79 1.78 3.71 3.71l-3.22 5.81C8.8 23.16.79 15.23 4.6 13.11Z"/>
        <path d="m10.5 9.5-1-2.29C9.2 6.48 8.8 6 8 6H4.5C2.79 6 2 6.5 2 8.5a7.71 7.71 0 0 0 2 4.83"/>
        <path d="M8 6c0-1.55.24-4-2-4-2 0-2.5 2.17-2.5 4"/>
        <path d="m14.5 13.5 2.29 1c.73.3 1.21.7 1.21 1.5v3.5c0 1.71-.5 2.5-2.5 2.5a7.71 7.71 0 0 1-4.83-2"/>
        <path d="M18 16c1.55 0 4-.24 4 2 0 2-2.17 2.5-4 2.5"/>
      </svg>
      <h1>BakeSync</h1>
    </div>
    <div class="navbar-user">
      <span id="navbar-username"></span>
      <span id="navbar-role" class="badge"></span>
      <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
    </div>
  </nav>

  <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>Point of Sale</h2>
      <p>Create orders quickly and track daily sales.</p>
    </div>

    <div class="content-card">
      <h3>New order (UI stub)</h3>
      <form class="upload-form" onsubmit="event.preventDefault(); alert('Wire POS endpoints when backend is ready.');">
        <div class="form-group">
          <label for="customer">Customer</label>
          <input id="customer" type="text" placeholder="Walk-in" />
        </div>
        <div class="form-group">
          <label for="item">Item</label>
          <select id="item" required>
            <option value="">Select item...</option>
            <option value="croissant">Croissant</option>
            <option value="sourdough">Sourdough</option>
            <option value="cake">Cake Slice</option>
          </select>
        </div>
        <div class="form-group">
          <label for="qty">Qty</label>
          <input id="qty" type="text" value="1" />
        </div>
        <div class="form-group">
          <label>&nbsp;</label>
          <button class="btn btn-primary" type="submit">Add to order</button>
        </div>
      </form>
    </div>

    <div class="content-card">
      <h3>Cart (placeholder)</h3>
      <table class="file-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Croissant</td>
            <td>2</td>
            <td>₱45</td>
            <td>₱90</td>
            <td class="file-actions"><button class="btn btn-ghost btn-sm" type="button" onclick="alert('Remove item (stub)')">Remove</button></td>
          </tr>
        </tbody>
      </table>
      <div class="flex justify-between items-center" style="margin-top: 1rem;">
        <span class="text-muted">Subtotal</span>
        <strong>₱90</strong>
      </div>
      <div class="flex justify-between items-center" style="margin-top: 0.5rem;">
        <span class="text-muted">Payment</span>
        <select style="max-width: 220px;">
          <option>Cash</option>
          <option>Card</option>
          <option>GCash</option>
        </select>
      </div>
      <div style="margin-top: 1rem;">
        <button class="btn btn-primary btn-full" type="button" onclick="alert('Checkout (stub)')">Checkout</button>
      </div>
    </div>

    <button onclick="history.back()" class="btn btn-outline">Back</button>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    if (requireAuth()) initNavbar();
  </script>
</body>
</html>
