<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Planning - BakeSync</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar"></aside>
    <div class="app-main">
      <div class="app-topbar">
        <div class="topbar-title">BakeSync · Production</div>
        <div class="topbar-actions">
          <a class="btn btn-outline btn-sm" href="profile.html">Settings</a>
        </div>
      </div>

      <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>Production Planning</h2>
      <p>Plan batches, assign tasks, and track progress.</p>
    </div>

    <div class="content-card">
      <h3>Create plan (UI stub)</h3>
      <form class="upload-form" onsubmit="event.preventDefault(); alert('Wire production endpoints when backend is ready.');">
        <div class="form-group">
          <label for="date">Date</label>
          <input id="date" type="text" placeholder="YYYY-MM-DD" />
        </div>
        <div class="form-group">
          <label for="recipe">Recipe</label>
          <select id="recipe" required>
            <option value="">Select...</option>
            <option value="croissant">Butter Croissant</option>
            <option value="bread">Sourdough Loaf</option>
            <option value="cake">Chocolate Cake</option>
          </select>
        </div>
        <div class="form-group">
          <label for="batch">Batch qty</label>
          <input id="batch" type="text" placeholder="e.g., 30" required />
        </div>
        <div class="form-group">
          <label>&nbsp;</label>
          <button class="btn btn-primary" type="submit">Add to schedule</button>
        </div>
      </form>
    </div>

    <div class="content-card">
      <h3>Schedule (placeholder)</h3>
      <table class="schedule-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Task</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>06:00</td>
            <td>Prep dough (Sourdough)</td>
            <td class="status-completed">completed</td>
          </tr>
          <tr>
            <td>09:00</td>
            <td>Bake croissants batch 1</td>
            <td class="status-in_progress">in progress</td>
          </tr>
          <tr>
            <td>13:00</td>
            <td>Decorate cake orders</td>
            <td class="status-pending">pending</td>
          </tr>
        </tbody>
      </table>
    </div>

        <button onclick="history.back()" class="btn btn-outline">Back</button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
    if (requireAuth()) initNavbar();
  </script>
</body>
</html>
