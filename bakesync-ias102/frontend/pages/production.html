<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Planning - BakeSync</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
        <path d="m4.6 13.11 5.79-3.21c1.89-1.05 4.79 1.78 3.71 3.71l-3.22 5.81C8.8 23.16.79 15.23 4.6 13.11Z"/>
        <path d="m10.5 9.5-1-2.29C9.2 6.48 8.8 6 8 6H4.5C2.79 6 2 6.5 2 8.5a7.71 7.71 0 0 0 2 4.83"/>
        <path d="M8 6c0-1.55.24-4-2-4-2 0-2.5 2.17-2.5 4"/>
        <path d="m14.5 13.5 2.29 1c.73.3 1.21.7 1.21 1.5v3.5c0 1.71-.5 2.5-2.5 2.5a7.71 7.71 0 0 1-4.83-2"/>
        <path d="M18 16c1.55 0 4-.24 4 2 0 2-2.17 2.5-4 2.5"/>
      </svg>
      <h1>BakeSync</h1>
    </div>
    <div class="navbar-user">
      <span id="navbar-username"></span>
      <span id="navbar-role" class="badge"></span>
      <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
    </div>
  </nav>

  <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>Production Planning</h2>
      <p>Plan batches, assign tasks, and track progress.</p>
    </div>

    <div class="content-card">
      <h3>Create plan (UI stub)</h3>
      <form class="upload-form" onsubmit="event.preventDefault(); alert('Wire production endpoints when backend is ready.');">
        <div class="form-group">
          <label for="date">Date</label>
          <input id="date" type="text" placeholder="YYYY-MM-DD" />
        </div>
        <div class="form-group">
          <label for="recipe">Recipe</label>
          <select id="recipe" required>
            <option value="">Select...</option>
            <option value="croissant">Butter Croissant</option>
            <option value="bread">Sourdough Loaf</option>
            <option value="cake">Chocolate Cake</option>
          </select>
        </div>
        <div class="form-group">
          <label for="batch">Batch qty</label>
          <input id="batch" type="text" placeholder="e.g., 30" required />
        </div>
        <div class="form-group">
          <label>&nbsp;</label>
          <button class="btn btn-primary" type="submit">Add to schedule</button>
        </div>
      </form>
    </div>

    <div class="content-card">
      <h3>Schedule (placeholder)</h3>
      <table class="schedule-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Task</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>06:00</td>
            <td>Prep dough (Sourdough)</td>
            <td class="status-completed">completed</td>
          </tr>
          <tr>
            <td>09:00</td>
            <td>Bake croissants batch 1</td>
            <td class="status-in_progress">in progress</td>
          </tr>
          <tr>
            <td>13:00</td>
            <td>Decorate cake orders</td>
            <td class="status-pending">pending</td>
          </tr>
        </tbody>
      </table>
    </div>

    <button onclick="history.back()" class="btn btn-outline">Back</button>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    if (requireAuth()) initNavbar();
  </script>
</body>
</html>
