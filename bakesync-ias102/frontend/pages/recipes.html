<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipes - BakeSync</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
        <path d="m4.6 13.11 5.79-3.21c1.89-1.05 4.79 1.78 3.71 3.71l-3.22 5.81C8.8 23.16.79 15.23 4.6 13.11Z"/>
        <path d="m10.5 9.5-1-2.29C9.2 6.48 8.8 6 8 6H4.5C2.79 6 2 6.5 2 8.5a7.71 7.71 0 0 0 2 4.83"/>
        <path d="M8 6c0-1.55.24-4-2-4-2 0-2.5 2.17-2.5 4"/>
        <path d="m14.5 13.5 2.29 1c.73.3 1.21.7 1.21 1.5v3.5c0 1.71-.5 2.5-2.5 2.5a7.71 7.71 0 0 1-4.83-2"/>
        <path d="M18 16c1.55 0 4-.24 4 2 0 2-2.17 2.5-4 2.5"/>
      </svg>
      <h1>BakeSync</h1>
    </div>
    <div class="navbar-user">
      <span id="navbar-username"></span>
      <span id="navbar-role" class="badge"></span>
      <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
    </div>
  </nav>

  <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>Recipes</h2>
      <p>Create, version, and share production recipes.</p>
    </div>

    <div class="content-card">
      <h3>Recipe library (placeholder)</h3>
      <table class="file-table">
        <thead>
          <tr>
            <th>Recipe</th>
            <th>Category</th>
            <th>Last updated</th>
            <th>Visibility</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Butter Croissant</td>
            <td>Pastry</td>
            <td>2 days ago</td>
            <td><span class="badge badge-public">Shared</span></td>
            <td class="file-actions">
              <button class="btn btn-ghost btn-sm" type="button" onclick="alert('Connect recipe view endpoint when ready.')">View</button>
              <button class="btn btn-ghost btn-sm" type="button" onclick="alert('Connect recipe edit endpoint when ready.')">Edit</button>
            </td>
          </tr>
          <tr>
            <td>Chocolate Cake</td>
            <td>Cake</td>
            <td>1 week ago</td>
            <td><span class="badge badge-private">Private</span></td>
            <td class="file-actions">
              <button class="btn btn-ghost btn-sm" type="button" onclick="alert('Connect recipe view endpoint when ready.')">View</button>
              <button class="btn btn-ghost btn-sm" type="button" onclick="alert('Connect recipe edit endpoint when ready.')">Edit</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="content-card">
      <h3>Create new recipe</h3>
      <form class="space-y-4" onsubmit="event.preventDefault(); alert('Wire this to backend when ready.');">
        <div class="form-group">
          <label for="name">Recipe name</label>
          <input id="name" type="text" placeholder="e.g., Sourdough Loaf" required />
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Select...</option>
            <option value="bread">Bread</option>
            <option value="pastry">Pastry</option>
            <option value="cake">Cake</option>
            <option value="cookies">Cookies</option>
          </select>
        </div>
        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" placeholder="Ingredients, steps, yield, etc."></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Save Recipe</button>
      </form>
    </div>

    <button onclick="history.back()" class="btn btn-outline">Back</button>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    if (requireAuth()) initNavbar();
  </script>
</body>
</html>
