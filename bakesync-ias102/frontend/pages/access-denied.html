<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Denied - BakeSync</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="auth-container">
    <div class="card">
      <div class="card-header">
        <div class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div>
          <h1 class="card-title">Access Denied</h1>
          <p class="card-description">You don’t have permission to view that page.</p>
        </div>
      </div>

      <div class="card-content">
        <div class="alert alert-destructive" style="display: flex;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
            <path d="M12 9v4"/>
            <path d="M12 17h.01"/>
          </svg>
          <span id="reason">Try signing in with the correct role.</span>
        </div>

        <div class="space-y-4">
          <button class="btn btn-primary btn-full" type="button" onclick="goDashboard()">Go to my dashboard</button>
          <button class="btn btn-outline btn-full" type="button" onclick="logout()">Sign out</button>
          <div class="text-center text-sm">
            <a href="login.html" class="link">Back to login</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    function goDashboard() {
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      const role = sessionStorage.getItem('role');
      const dashboardMap = {
        admin: 'dashboard-admin.html',
        staff: 'dashboard-staff.html',
        user: 'dashboard-user.html'
      };
      window.location.href = dashboardMap[role] || 'dashboard-user.html';
    }

    (function init() {
      const params = new URLSearchParams(window.location.search);
      const msg = params.get('reason');
      if (msg) document.getElementById('reason').textContent = msg;
    })();
  </script>
</body>
</html>
