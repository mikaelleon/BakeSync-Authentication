<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier Dashboard - BakeSync</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-content" id="main-content">
            <header class="topbar">
                <button class="hamburger" id="hamburger" type="button" aria-label="Open sidebar"></button>
                <div class="topbar-right">
                    <span class="topbar-username" id="topbar-username"></span>
                    <span class="topbar-role-badge" id="topbar-role-badge"></span>
                    <button class="btn btn-ghost btn-sm topbar-logout" id="topbar-logout" type="button">Sign Out</button>
                </div>
            </header>

            <main class="page-content" id="page-content"></main>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        const user = getCurrentUser();
        const usernameEl = document.getElementById('topbar-username');
        const roleEl = document.getElementById('topbar-role-badge');
        const logoutBtn = document.getElementById('topbar-logout');
        if (usernameEl) usernameEl.textContent = user.username || '';
        if (roleEl) roleEl.textContent = getRoleDisplayName(user.role);
        if (logoutBtn) logoutBtn.addEventListener('click', logout);

        initSidebar();
        setActiveNavItem();
        initMobileSidebar();
        loadUserDashboard();
    </script>
</body>
</html>
