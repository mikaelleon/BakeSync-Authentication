<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager - BakeSync</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-content" id="main-content">
            <div class="app-topbar">
                <button class="hamburger" id="hamburger" type="button" aria-label="Open sidebar">☰</button>
                <div class="topbar-title">BakeSync · Document Manager</div>
                <div class="topbar-actions">
                    <a class="btn btn-outline btn-sm" href="profile.html">Settings</a>
                </div>
            </div>

            <div class="dashboard-container">
                <div class="dashboard-header">
                    <h2>Document Manager</h2>
                    <p>Files you own and public files are shown below. DAC (Discretionary Access Control) enforces file ownership.</p>
                </div>

        <div id="error-alert" class="alert alert-destructive" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                <path d="M12 9v4"/>
                <path d="M12 17h.01"/>
            </svg>
            <span id="error-message"></span>
        </div>

        <div id="success-alert" class="alert alert-success" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span id="success-message"></span>
        </div>

        <!-- Upload Panel (collapsible) -->
        <div class="content-card">
            <button class="btn btn-primary btn-full" type="button" id="files-upload-toggle">+ Add New Document</button>

            <div class="docmgr-upload collapsed" id="files-upload-panel">
                <div class="docmgr-upload-panel">
                    <form id="upload-form">
                        <div class="docmgr-upload-form-grid">
                            <div class="form-group">
                                <label for="files-filename">Filename</label>
                                <input type="text" id="files-filename" placeholder="e.g., cake_recipe.pdf" required>
                            </div>
                            <div class="form-group">
                                <label for="files-file-type">File Type</label>
                                <select id="files-file-type" required>
                                    <option value="recipe">Recipe</option>
                                    <option value="report">Report</option>
                                    <option value="schedule">Schedule</option>
                                    <option value="invoice">Invoice</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group" style="margin-top: 0.75rem;">
                            <label for="files-description">Description</label>
                            <textarea id="files-description" rows="2" placeholder="Optional description"></textarea>
                        </div>

                        <div class="docmgr-upload-actions">
                            <label class="checkbox-wrapper" style="display:flex; align-items:center; gap:0.5rem; margin-right:auto;">
                                <input type="checkbox" id="files-is-public">
                                <span>Make file public</span>
                            </label>
                            <button type="submit" class="btn btn-primary">Upload File</button>
                            <a href="#" class="btn btn-outline" id="files-upload-cancel">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- File Type Tabs + Search + Card List -->
        <div class="content-card">
            <div class="files-filter-bar" style="display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; flex-wrap:wrap;">
                <div class="file-type-tabs" id="files-type-tabs" role="tablist" aria-label="File type filters">
                    <button type="button" class="file-type-tab" data-type="all">All</button>
                    <button type="button" class="file-type-tab" data-type="recipe">Recipes</button>
                    <button type="button" class="file-type-tab" data-type="report">Reports</button>
                    <button type="button" class="file-type-tab" data-type="schedule">Schedules</button>
                    <button type="button" class="file-type-tab" data-type="invoice">Invoices</button>
                </div>

                <div class="docmgr-search" style="margin:0;">
                    <input type="search" id="files-search" placeholder="Search files..." style="min-width: 260px;">
                </div>
            </div>

            <div id="files-empty" style="display:none; margin-top:1rem;"></div>

            <div id="loading" class="loading" style="display:none; margin-top:1rem;">
                <div class="spinner"></div>
            </div>

            <div id="files-list" class="docmgr-list" style="margin-top:1rem;"></div>
        </div>

            </div>
        </div>
    </div>

    <!-- File Details Modal -->
    <div id="file-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">File Details</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body" class="modal-body">
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/files.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        initSidebar();
        setActiveNavItem();
        initFileManager();
    </script>
</body>
</html>
