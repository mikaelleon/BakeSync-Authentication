<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager - BakeSync</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside id="app-sidebar"></aside>
        <div class="app-main">
            <div class="app-topbar">
                <div class="topbar-title">BakeSync · Document Manager</div>
                <div class="topbar-actions">
                    <a class="btn btn-outline btn-sm" href="profile.html">Settings</a>
                </div>
            </div>

            <div class="dashboard-container">
                <div class="dashboard-header">
                    <h2>Document Manager</h2>
                    <p>Files you own and public files are shown below. DAC (Discretionary Access Control) enforces file ownership.</p>
                </div>

        <div id="error-alert" class="alert alert-destructive" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                <path d="M12 9v4"/>
                <path d="M12 17h.01"/>
            </svg>
            <span id="error-message"></span>
        </div>

        <div id="success-alert" class="alert alert-success" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span id="success-message"></span>
        </div>

        <!-- Upload Form -->
        <div class="content-card">
            <h3>Upload New File</h3>
            <form id="upload-form" class="upload-form">
                <div class="form-group">
                    <label for="filename">Filename</label>
                    <input type="text" id="filename" placeholder="e.g., cake_recipe.pdf" required>
                </div>
                <div class="form-group">
                    <label for="file-type">File Type</label>
                    <select id="file-type" required>
                        <option value="">Select type...</option>
                        <option value="recipe">Recipe</option>
                        <option value="report">Report</option>
                        <option value="schedule">Schedule</option>
                        <option value="invoice">Invoice</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="Optional description">
                </div>
                <div class="form-group">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="is-public">
                        <span>Make file public</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">Upload File</button>
            </form>
        </div>

        <!-- File Table -->
        <div class="content-card">
            <h3>Your Files</h3>
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
            </div>
            <table class="file-table">
                <thead>
                    <tr>
                        <th>Filename</th>
                        <th>Type</th>
                        <th>Owner</th>
                        <th>Visibility</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="files-body">
                </tbody>
            </table>
        </div>

                <button onclick="history.back()" class="btn btn-outline">Back</button>
            </div>
        </div>
    </div>

    <!-- File Details Modal -->
    <div id="file-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">File Details</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body" class="modal-body">
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/files.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        initFileManager();
    </script>
</body>
</html>
