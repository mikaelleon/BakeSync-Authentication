<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics - BakeSync</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar"></aside>
    <div class="app-main">
      <div class="app-topbar">
        <div class="topbar-title">BakeSync · Analytics</div>
        <div class="topbar-actions">
          <a class="btn btn-outline btn-sm" href="profile.html">Settings</a>
        </div>
      </div>

      <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>Analytics</h2>
      <p>High-level business insights (UI stub).</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Revenue (30d)</h3>
        <div class="value">₱48,120</div>
      </div>
      <div class="stat-card">
        <h3>Orders (30d)</h3>
        <div class="value">612</div>
      </div>
      <div class="stat-card">
        <h3>Top item</h3>
        <div class="value" style="font-size: 1.25rem;">Croissant</div>
      </div>
    </div>

    <div class="content-card">
      <h3>Reports</h3>
      <p class="text-muted text-sm" style="margin-bottom: 1rem;">
        When you wire backend reporting endpoints, you can generate and store reports as files via the existing File Manager.
      </p>
      <div class="file-actions">
        <button class="btn btn-primary" type="button" onclick="alert('Generate sales report (stub)')">Generate Sales Report</button>
        <a class="btn btn-outline" href="files.html">Open File Manager</a>
      </div>
    </div>

        <button onclick="history.back()" class="btn btn-outline">Back</button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
    if (requireAuth()) initNavbar();
  </script>
</body>
</html>
