<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email - BakeSync</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="card">
            <div class="card-header">
                <div class="card-icon">
                    <!-- Mail Check Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h8"/>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        <path d="m16 19 2 2 4-4"/>
                    </svg>
                </div>
                <div>
                    <h1 class="card-title">Verify Your Email</h1>
                    <p class="card-description">
                        Enter the 6-digit code sent to your email address to complete your registration.
                    </p>
                </div>
            </div>

            <div class="card-content">
                <form id="otp-form" onsubmit="handleOTPVerify(event)">
                    <div id="error-alert" class="alert alert-destructive" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                            <path d="M12 9v4"/>
                            <path d="M12 17h.01"/>
                        </svg>
                        <span id="error-message"></span>
                    </div>

                    <div class="space-y-4">
                        <p class="text-sm text-muted" style="text-align: center;">
                            Registering as: <strong id="username-display"></strong>
                        </p>

                        <div class="form-group">
                            <label for="otp">Verification Code</label>
                            <input
                                type="text"
                                id="otp"
                                name="otp"
                                class="otp-input"
                                placeholder="000000"
                                maxlength="6"
                                pattern="[0-9]{6}"
                                required
                                autocomplete="one-time-code"
                            >
                        </div>

                        <button type="submit" id="submit-btn" class="btn btn-primary btn-full">
                            Verify Code
                        </button>

                        <div class="text-center">
                            <a href="login.html" class="link text-sm">Back to Login</a>
                        </div>
                    </div>
                </form>

                <div class="demo-box">
                    <p class="demo-box-content" style="text-align: center;">
                        Check your email inbox for the verification code. The code expires in 10 minutes.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        initOTPPage();
    </script>
</body>
</html>
